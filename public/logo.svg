<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    /* Inverts with the OS theme so the mark never sits #222 on #222. Honoured
       when the file is used as a favicon and via &lt;img&gt;. */
    .bg { fill: #222222; }
    .fg { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .fg { stroke: #222222; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <rect class="fg" x="13" y="19" width="38" height="27" rx="4" fill="none" stroke-width="3"/>
  <path class="fg" d="m15 22 14.5 11a4 4 0 0 0 5 0L49 22" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
